<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                font-family: system-ui, -apple-system, sans-serif;
                margin: 20px;
            }

            #status {
                font-weight: bold;
                margin-bottom: 10px;
            }

            .container {
                display: flex;
                gap: 20px;
                margin-top: 15px;
            }

            #chat, #UserOnline {
                list-style: none;
                padding: 10px;
                margin: 0;
                border: 1px solid #ddd;
                border-radius: 6px;
                min-height: 300px;
                width: 320px;
                overflow-y: auto;
            }
            .msg-usr {
                background: #f1f5f9;
                padding: 6px 10px;
                margin-bottom: 6px;
                border-radius: 6px;
                font-size: 14px;
            }

            .self_msg {
                background-color: hsl(201, 95%, 69%);
                color: white;
                padding: 6px 10px;
                margin-bottom: 6px;
                border-radius: 6px;
                text-align: right;
                font-size: 14px;
            }

            .msg-system {
                font-size: 13px;
                color: #666;
                font-style: italic;
                text-align: center;
                margin: 8px 0;
            }

            input, select, button {
                padding: 6px;
                margin-right: 6px;
                margin-bottom: 6px;
            }
            @media (max-width: 700px) {
                .container {
                flex-direction: column;
                }

                #chat, #UserOnline {
                width: 100%;
                min-height: 200px;
                }
            }
            </style>


    </head>
<body>
    <div id="auth_section">
        <h2>welcome to the best chatroom</h2>
        <input id="auth_user" placeholder="Username">
        <input id="auth_pass" placeholder="Password">
        <button onclick="handleauth('signup')">Sign Up</button>
        <button onclick="handleauth('login')">Login Up</button>
        <p id="auth_error" style="color: red;"></p>
    </div>
    <div id="chat_section" style="display: none;">
        <p id="status">Disconnected</p>
        <input id="msg" placeholder="Type message" />
        <select id="reciever_choice" name="Reciever">    
        </select>
        <button id="btn" onclick="send()" disabled>Send</button>
        <div class="container">
            <ul id="chat"></ul>
            <ul id="UserOnline"></ul>
        </div>
    </div>


    <script>
        let ws;
        let clientId="";
        //devlopment only
        //let root_url_ws="ws://127.0.0.1:8000/ws";
        //let root_url_http="http://127.0.0.1:8000/";

        //deployement url
        let root_url_http="https://chatroom-as5j.onrender.com/";
        let root_url_ws = "wss://chatroom-as5j.onrender.com/ws";

        window.onload=()=>{
            const savedToken=localStorage.getItem("chat_token");
            const savedUsr=localStorage.getItem("chat_user");
            if(savedToken&&savedUsr){
                clientId=savedUsr;
                start_chat(savedToken);
            }
        }

        async function handleauth(type){
            const user_auth=document.getElementById("auth_user").value;
            const password_auth=document.getElementById("auth_pass").value;
            errorl=document.getElementById("auth_error");
            let url=root_url_http+type;
            try{
                const response=await fetch(url,{
                    method:'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: user_auth, password: password_auth })
                });
                const data=await response.json();
                if(type=="signup"){
                    throw new Error(data.status||data.detail);
                }

                if(!response.ok)throw new Error(data.detail||"something went wrong, index 117");
                if(type=="login"){
                    clientId=user_auth;
                    const token=data.access_token;
                    localStorage.setItem("chat_token",token);
                    localStorage.setItem("chat_user",clientId);
                    start_chat(token);
                }
            }
            catch(err){
                errorl.textContent=err.message;
            }

        }
        function start_chat(token){
            document.getElementById("auth_section").style.display="none";
            document.getElementById("chat_section").style.display="block";
            let websocket_url=root_url_ws+`?token=${token}`;
            ws=new WebSocket(websocket_url);
            ws.onopen = () => {
                document.getElementById("btn").disabled = false;
                document.getElementById("status").textContent=`Connected as  ${clientId}`;
            };
            ws.onmessage = (event) => {
                const data=JSON.parse(event.data);
                if(data.message_type=="dm"){
                    data.message="[WHISPER]  "+data.message;
                }
                if(data.message_type=="client_id"){
                    clientId=data.message;
                    document.getElementById("status").textContent =
                    `Connected as client ${clientId}`;
                    return;
                }
                if (data.message_type=="user_list"){
                    const ul=document.getElementById("UserOnline");
                    const select=document.getElementById("reciever_choice");
                    select.innerHTML="";
                    ul.innerHTML="";

                    const allOpt=document.createElement("option")
                    allOpt.value = "all";
                    allOpt.textContent = "All";
                    select.appendChild(allOpt);
                    const users=JSON.parse(data.message)
                    users.forEach(id=>{
                        if (id==clientId)return;
                        const li=document.createElement("li");
                        li.textContent=`User ${id}`;
                        ul.appendChild(li);

                        const opt = document.createElement("option");
                        opt.value = id;
                        opt.textContent = `User ${id}`;
                        select.appendChild(opt);
                    });
                    return;
                }

                const li = document.createElement("li");
                if (data.sender_id === "server") {
                    li.classList.add("msg-system");
                    li.textContent = `[SYSTEM] ${data.message}`;
                } else {
                    li.classList.add("msg-usr");
                    li.textContent = `User ${data.sender_id}: ${data.message}`;
                }
                document.getElementById("chat").appendChild(li);
            };
                ws.onclose = (event) => {
                    console.log(event.code,event.reason)
                        document.getElementById("btn").disabled=true;
                    
                        localStorage.removeItem("chat_token");
                        localStorage.removeItem("chat_user");
                        document.getElementById("chat_section").style.display="none";
                        document.getElementById("auth_section").style.display="block";
                        document.getElementById("status").textContent="Disconnected";
                        ws=null;

                    
                document.getElementById("status").textContent = "Disconnected";
            };
            ws.onerror=(err)=>{
                console.error("WEBSOCKET ERROR :",err);
            };
        }
        function send() {           
            const input = document.getElementById("msg");
            const select=document.getElementById("reciever_choice");


            const mssg_text=input.value;
            if(!mssg_text)return;

            let msg;

            if(select.value=="all"){
                msg={
                    message_type:"broadcast",
                    sender_id:clientId,
                    reciever_id:null,
                    message:mssg_text
                };
            }
            else{
                msg={
                    message_type:"dm",
                    sender_id:clientId,
                    reciever_id:select.value,
                    message:mssg_text
                };

            }

            ws.send(JSON.stringify(msg));
            chat=document.getElementById("chat");
            const li=document.createElement("li");
            li.classList.add("self_msg");
            li.textContent=mssg_text;
            chat.appendChild(li);
            input.value = "";
        }
    
    </script>
</body>
</html>
